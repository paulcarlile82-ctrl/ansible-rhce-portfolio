---
- name:  config and test webserver
  hosts: node1
  tasks:
    -  name:  install  http  package
       ansible.builtin.dnf:
         name: httpd
         state: present

    - name: permit http firewall
      ansible.builtin.firewalld:
        service: http
        permanent:  true
        immediate:  true
        state: enabled

    - name:  create index.html
      ansible.builtin.copy:
        content:  "welcome to node1 web server\n" 
        dest:  /var/www/html/index.html
        mode:  '0644'

    -  name: enable/st:art httpd
       ansible.builtin.systemd:
         name:  httpd
         state:  started
         enabled:  true
      
