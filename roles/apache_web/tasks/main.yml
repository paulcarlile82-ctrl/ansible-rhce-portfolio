---
- name: install packages
  ansible.builtin.dnf:
    name:
      - httpd
      - firewalld
    state: present

- name: systemd handover httpd
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: true

- name: systemd handover firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: enable firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  notify: Restart httpd

  

# tasks file for roles/apache_web
